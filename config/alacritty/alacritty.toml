# Mirrors ~/.config/foot/foot.ini — Gruvbox Dark, 80% opacity, BitstromWera 13pt

[env]
TERM = "xterm-256color"

[window]
opacity = 0.8
padding = { x = 0, y = 0 }
resize_increments = true

[scrolling]
multiplier = 3

[font]
size = 13
builtin_box_drawing = true

[font.normal]
family = "BitstromWera Nerd Font"
style = "Regular"

[font.bold]
family = "BitstromWera Nerd Font"
style = "Bold"

[font.italic]
family = "BitstromWera Nerd Font"
style = "Italic"

[font.bold_italic]
family = "BitstromWera Nerd Font"
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "Off" }
# foot keeps the block solid when the window loses focus
unfocused_hollow = false

[terminal]
osc52 = "CopyPaste"

[mouse]
hide_when_typing = false

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.normal]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"
